<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Punto de Venta - Comercial Adelaida</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f4f6;color:#202124}
.app{max-width:900px;margin:auto;padding:14px}
.card,.header{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
h1{margin:0;font-size:24px}
.sub{color:#666;margin-top:4px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
button{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.tabs button{background:#e9e9ee}
.tabs button.activo{background:#222;color:#fff}
input,select,textarea{width:100%;border:1px solid #d5d5db;border-radius:12px;padding:12px;font-size:16px;background:#fff}
textarea{min-height:65px}
label{display:block;font-size:13px;font-weight:700;margin-top:10px;margin-bottom:5px}
.fila{display:flex;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnNegro{background:#222;color:#fff}
.btnAzul{background:#0d6efd;color:#fff}
.btnVerde{background:#198754;color:#fff}
.btnRojo{background:#c0392b;color:#fff}
.btnGris{background:#e9e9ee}
.btnMorado{background:#5a3ec8;color:#fff}
.oculto{display:none!important}
.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.dato{background:#f4f4f6;border-radius:12px;padding:10px}
.dato b{font-size:21px;display:block}
.dato span{font-size:12px;color:#666}
.mensaje{padding:11px;border-radius:12px;margin-top:10px}
.ok{background:#dcf4e5;color:#135d31}
.error{background:#ffe3e3;color:#8e2525}
.info{background:#e8f1ff;color:#244d7c}
.buscadorAuto{position:relative;flex:1}
.listaSugerencias{position:absolute;top:calc(100% + 5px);left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:320px;overflow:auto;z-index:9999}
.itemSugerencia{padding:12px;border-bottom:1px solid #eee}
.sugCodigo{font-weight:800}
.sugDetalle{font-size:13px;color:#666;margin-top:3px}
.scanner{width:100%;overflow:hidden;border-radius:14px;margin-top:10px}
.cartItem{border:1px solid #e3e3e8;border-radius:14px;padding:12px;margin-top:10px}
.cartTop{display:flex;justify-content:space-between;gap:8px}
.cartMeta{font-size:12px;color:#666}
.cartControls{display:grid;grid-template-columns:45px 58px 45px 1fr;gap:6px;margin-top:9px}
.cartControls input{text-align:center;padding:8px}
.totales{background:#f4f4f6;border-radius:14px;padding:14px;margin-top:14px}
.lineaTotal{display:flex;justify-content:space-between;margin-top:5px}
.totalGrande{font-size:30px;font-weight:900}
.cambio{background:#dcf4e5;border-radius:12px;padding:12px;margin-top:10px;text-align:center}
.cambio b{font-size:25px}
.producto{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.campo{background:#f4f4f6;border-radius:11px;padding:10px}
.campo span{font-size:11px;color:#777;display:block}
.codigoAuto{text-align:center;font-weight:800;padding:12px;background:#eef1ff;border-radius:12px;margin-top:10px}
.qrBox{text-align:center;padding:12px;background:#f4f4f6;border-radius:14px;margin-top:12px}
.qrBox img{max-width:220px;width:100%}
.ticket{font-family:monospace;background:#fff;padding:16px;max-width:360px;margin:auto}
.ticket h2{text-align:center;margin:0}
.ticket hr{border:0;border-top:1px dashed #333}
.ticket table{width:100%}
.derecha{text-align:right}
.centro{text-align:center}
@media(max-width:700px){.tabs,.resumen{grid-template-columns:1fr 1fr}.grid2,.producto{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}.ticket,.ticket *{visibility:visible}.ticket{position:absolute;left:0;top:0;width:100%}.noPrint{display:none!important}}
</style>
</head>

<body>

<div class="app">

<div class="header">
<h1>Punto de Venta — Comercial Adelaida</h1>
<div class="sub">Ventas, inventario y QR</div>
<div id="estadoApi">Configure Google Sheets.</div>

<div class="resumen">
<div class="dato"><b id="rReferencias">—</b><span>Referencias</span></div>
<div class="dato"><b id="rPares">—</b><span>Pares</span></div>
<div class="dato"><b id="rVentasHoy">—</b><span>Ventas hoy</span></div>
<div class="dato"><b id="rTotalHoy">—</b><span>Vendido hoy</span></div>
</div>
</div>

<div class="tabs">
<button id="tabPos" class="activo" onclick="vista('pos')">🛒 Punto de venta</button>
<button id="tabInventario" onclick="vista('inventario')">Inventario</button>
<button id="tabNuevo" onclick="vista('nuevo')">+ Producto</button>
<button id="tabConfig" onclick="vista('config')">⚙ Configuración</button>
</div>

<div id="vistaPos">

<div class="card">

<div class="fila">

<div class="buscadorAuto">
<input id="posCodigo" autocomplete="off" placeholder="Código, modelo, marca o color">
<div id="sugerenciasPos" class="listaSugerencias oculto"></div>
</div>

<button class="btnNegro" onclick="agregar()">Agregar</button>

</div>

<button
id="btnCamPos"
class="btnAzul"
style="width:100%;margin-top:9px"
onclick="toggleCam()">
📷 Abrir cámara continua
</button>

<div id="scanPosBox" class="oculto">
<div id="readerPos" class="scanner"></div>
</div>

<div id="mensajePos"></div>

<div id="carritoLista"></div>

<div class="totales">
<div class="lineaTotal"><span>Pares</span><strong id="posPares">0</strong></div>
<div class="lineaTotal"><span>Subtotal</span><strong id="posSubtotal">Q0.00</strong></div>
<div class="lineaTotal"><span>Descuento</span><strong id="posDescuentoVista">Q0.00</strong></div>
<div class="lineaTotal"><span>Total</span><span class="totalGrande" id="posTotal">Q0.00</span></div>
</div>

<div class="grid2">

<div>
<label>Cliente</label>
<input id="posCliente" placeholder="Opcional">
</div>

<div>
<label>NIT</label>
<input id="posNit" placeholder="CF o NIT">
</div>

<div>
<label>Forma de pago</label>

<select id="posMetodo" onchange="actualizarPago()">
<option>EFECTIVO</option>
<option>TRANSFERENCIA</option>
<option>TARJETA</option>
</select>
</div>

<div>
<label>Descuento Q</label>
<input id="posDescuento" type="number" min="0" step="0.01" value="0" oninput="renderCarrito()">
</div>

<div id="efectivoBox">
<label>Efectivo recibido Q</label>
<input id="posEfectivo" type="number" min="0" step="0.01" value="0" oninput="actualizarCambio()">
</div>

<div>
<label>Vendedor</label>
<input id="posUsuario">
</div>

</div>

<label>Nota</label>
<textarea id="posNota"></textarea>

<div id="cambioBox" class="cambio">
Cambio:
<b id="posCambio">Q0.00</b>
</div>

<button
class="btnVerde"
style="width:100%;font-size:18px;margin-top:12px"
onclick="cobrar()">
COBRAR VENTA
</button>

<button
class="btnGris"
style="width:100%;margin-top:8px"
onclick="vaciar()">
Vaciar carrito
</button>

</div>

<div id="ticketCard" class="card oculto">

<div id="ticket" class="ticket"></div>

<button
class="btnNegro noPrint"
style="width:100%;margin-top:10px"
onclick="window.print()">
🖨 Imprimir comprobante
</button>

<button
class="btnGris noPrint"
style="width:100%;margin-top:8px"
onclick="ticketCard.classList.add('oculto')">
Nueva venta
</button>

</div>

</div>

<div id="vistaInventario" class="oculto">

<div class="card">

<div class="fila">

<div class="buscadorAuto">
<input id="codigo" autocomplete="off" placeholder="Código, modelo, marca o color">
<div id="sugerenciasInv" class="listaSugerencias oculto"></div>
</div>

<button class="btnNegro" onclick="consultar()">Buscar</button>

</div>

<div id="mensaje"></div>

</div>

<div id="productoCard" class="card oculto">

<div class="producto">

<div class="campo">
<span>Código</span>
<b id="pCodigo"></b>
</div>

<div class="campo">
<span>Marca</span>
<b id="pMarca"></b>
</div>

<div class="campo">
<span>Modelo</span>
<b id="pModelo"></b>
</div>

<div class="campo">
<span>Color</span>
<b id="pColor"></b>
</div>

<div class="campo">
<span>Talla</span>
<b id="pTalla"></b>
</div>

<div class="campo">
<span>Existencia</span>
<b id="pExistencia"></b>
</div>

<div class="campo">
<span>Precio</span>
<b id="pPrecio"></b>
</div>

<div class="campo">
<span>Ubicación</span>
<b id="pUbicacion"></b>
</div>

</div>

<label>Cantidad</label>
<input id="cantidad" type="number" min="1" value="1">

<label>Responsable</label>
<input id="usuario">

<label>Nota</label>
<textarea id="nota"></textarea>

<div class="fila" style="margin-top:12px">

<button
class="btnVerde"
style="flex:1"
onclick="mover('ENTRADA')">
+ Entrada
</button>

<button
class="btnRojo"
style="flex:1"
onclick="mover('SALIDA')">
− Salida
</button>

</div>

</div>

</div>

<div id="vistaNuevo" class="oculto">

<div class="card">

<div class="grid2">

<div>
<label>Marca</label>
<input id="nMarca">
</div>

<div>
<label>Modelo</label>
<input id="nModelo" oninput="codigoAuto()">
</div>

<div>
<label>Categoría</label>
<input id="nCategoria">
</div>

<div>
<label>Color</label>
<input id="nColor" oninput="codigoAuto()">
</div>

<div>
<label>Talla</label>
<input id="nTalla" oninput="codigoAuto()">
</div>

<div>
<label>Ubicación</label>
<input id="nUbicacion">
</div>

<div>
<label>Costo</label>
<input id="nCosto" type="number" step="0.01">
</div>

<div>
<label>Precio</label>
<input id="nPrecio" type="number" step="0.01">
</div>

<div>
<label>Existencia inicial</label>
<input id="nExistencia" type="number" value="0">
</div>

<div>
<label>Stock mínimo</label>
<input id="nStockMinimo" type="number" value="2">
</div>

</div>

<div id="codigoAuto" class="codigoAuto">
Código automático: —
</div>

<label>Responsable</label>
<input id="nUsuario">

<label>Nota</label>
<textarea id="nNota"></textarea>

<button
class="btnMorado"
style="width:100%;margin-top:12px"
onclick="guardarProducto()">
Guardar producto y generar QR
</button>

<div id="mensajeNuevo"></div>

<div id="qrResultado" class="qrBox oculto">

<strong id="qrCodigo"></strong>

<br>

<img id="qrImagen">

</div>

</div>

</div>

<div id="vistaConfig" class="oculto">

<div class="card">

<h3>Configuración</h3>

<label>URL Apps Script</label>

<input
id="apiUrl"
placeholder="https://script.google.com/macros/s/.../exec">

<label>Clave</label>

<input
id="apiClave"
type="password"
placeholder="ADELAIDA2026">

<button
class="btnNegro"
style="width:100%;margin-top:12px"
onclick="guardarConfig()">
Guardar configuración
</button>

<button
class="btnGris"
style="width:100%;margin-top:8px"
onclick="probar()">
Probar conexión
</button>

<div id="mensajeConfig"></div>

</div>

</div>

</div>

<script>

let API_URL=
localStorage.getItem('adelaida_api_url')||'';

let API_CLAVE=
localStorage.getItem('adelaida_api_clave')||'';

let carrito=[];
let productoActual=null;
let scannerPos=null;

let ultimo='';
let ultimoTs=0;

let t1=null;
let t2=null;

document.addEventListener(
'DOMContentLoaded',
()=>{

apiUrl.value=API_URL;
apiClave.value=API_CLAVE;

auto(
'posCodigo',
'pos',
()=>t1,
v=>t1=v
);

auto(
'codigo',
'inv',
()=>t2,
v=>t2=v
);

posCodigo.addEventListener(
'keydown',
e=>{
if(e.key==='Enter')agregar()
}
);

codigo.addEventListener(
'keydown',
e=>{
if(e.key==='Enter')consultar()
}
);

if(API_URL)probar();

renderCarrito();

}
);

function vista(v){

[
'pos',
'inventario',
'nuevo',
'config'
]
.forEach(
n=>{

const M=
n[0].toUpperCase()+
n.slice(1);

document
.getElementById(
'vista'+M
)
.classList
.toggle(
'oculto',
n!==v
);

document
.getElementById(
'tab'+M
)
.classList
.toggle(
'activo',
n===v
);

}
);

}

function auto(
id,
modo,
getT,
setT
){

document
.getElementById(id)
.addEventListener(
'input',
function(){

clearTimeout(
getT()
);

const q=
this.value.trim();

setT(
setTimeout(
()=>sugerencias(q,modo),
180
)
);

}
);

}

function sugerencias(
q,
modo
){

const c=
document.getElementById(
modo==='pos'
?
'sugerenciasPos'
:
'sugerenciasInv'
);

if(!q){

c.classList.add(
'oculto'
);

return;

}

api(
'sugerir',
{q},
r=>{

c.innerHTML='';

(r.sugerencias||[])
.forEach(
p=>{

const d=
document.createElement(
'div'
);

d.className=
'itemSugerencia';

d.innerHTML=

'<div class="sugCodigo">'+
esc(p.codigo)+
'</div>'+

'<div class="sugDetalle">'+
esc(p.marca)+
' · '+
esc(p.modelo)+
' · '+
esc(p.color)+
' · Talla '+
esc(p.talla)+
' · '+
p.existencia+
' pares · '+
Q(p.precio)+
'</div>';

d.onclick=
()=>{

if(modo==='pos'){

posCodigo.value=
p.codigo;

c.classList.add(
'oculto'
);

agregar(
p.codigo
);

}else{

codigo.value=
p.codigo;

c.classList.add(
'oculto'
);

consultar(
p.codigo
);

}

};

c.appendChild(
d
);

}
);

c.classList.toggle(
'oculto',
!(r.sugerencias||[]).length
);

}
);

}

function agregar(cod){

const c=
(
cod||
posCodigo.value||
''
)
.trim();

if(!c){

return msg(
'mensajePos',
'Ingrese un producto.',
'error'
);

}

posCodigo.value='';

api(
'buscar',
{codigo:c},
p=>{

if(!p.encontrado){

return msg(
'mensajePos',
'Producto no encontrado.',
'error'
);

}

if(p.existencia<=0){

return msg(
'mensajePos',
'Producto agotado.',
'error'
);

}

const x=
carrito.find(
z=>z.codigo===p.codigo
);

if(x){

if(
x.cantidad+1>
p.existencia
){

return msg(
'mensajePos',
'No hay más existencia.',
'error'
);

}

x.cantidad++;

}else{

carrito.push({
...p,
cantidad:1
});

}

renderCarrito();

msg(
'mensajePos',
'Agregado: '+
p.codigo,
'ok'
);

}
);

}

function renderCarrito(){

carritoLista.innerHTML='';

let pares=0;
let sub=0;

carrito.forEach(
(x,i)=>{

pares+=x.cantidad;

sub+=
x.precio*
x.cantidad;

const d=
document.createElement(
'div'
);

d.className=
'cartItem';

d.innerHTML=

'<div class="cartTop">'+

'<div>'+

'<b>'+
esc(x.marca)+
' '+
esc(x.modelo)+
'</b>'+

'<div class="cartMeta">'+
esc(x.color)+
' · Talla '+
esc(x.talla)+
' · '+
esc(x.codigo)+
'</div>'+

'</div>'+

'<b>'+
Q(
x.precio*
x.cantidad
)+
'</b>'+

'</div>'+

'<div class="cartControls">'+

'<button onclick="cant('+
i+
',-1)">−</button>'+

'<input readonly value="'+
x.cantidad+
'">' +

'<button onclick="cant('+
i+
',1)">+</button>'+

'<button class="btnRojo" onclick="quitar('+
i+
')">Quitar</button>'+

'</div>';

carritoLista.appendChild(
d
);

}
);

const desc=
Math.min(
Math.max(
0,
Number(
posDescuento.value
)||0
),
sub
);

const tot=
sub-desc;

posPares.textContent=
pares;

posSubtotal.textContent=
Q(sub);

posDescuentoVista.textContent=
Q(desc);

posTotal.textContent=
Q(tot);

actualizarCambio();

}

function cant(
i,
d
){

const x=
carrito[i];

const n=
x.cantidad+d;

if(n<=0){

carrito.splice(
i,
1
);

}else if(
n<=x.existencia
){

x.cantidad=n;

}else{

msg(
'mensajePos',
'Solo hay '+
x.existencia+
' disponibles.',
'error'
);

}

renderCarrito();

}

function quitar(i){

carrito.splice(
i,
1
);

renderCarrito();

}

function vaciar(){

if(
carrito.length&&
confirm(
'¿Vaciar carrito?'
)
){

carrito=[];

renderCarrito();

}

}

function total(){

const sub=
carrito.reduce(
(s,x)=>
s+
x.precio*
x.cantidad,
0
);

const desc=
Math.min(
Math.max(
0,
Number(
posDescuento.value
)||0
),
sub
);

return{
sub,
desc,
total:sub-desc
};

}

function actualizarPago(){

const e=
posMetodo.value===
'EFECTIVO';

efectivoBox
.classList
.toggle(
'oculto',
!e
);

cambioBox
.classList
.toggle(
'oculto',
!e
);

actualizarCambio();

}

function actualizarCambio(){

const t=
total();

const r=
Number(
posEfectivo.value
)||0;

posCambio.textContent=
Q(
posMetodo.value===
'EFECTIVO'
?
Math.max(
0,
r-t.total
)
:
0
);

}

function cobrar(){

if(!carrito.length){

return msg(
'mensajePos',
'Carrito vacío.',
'error'
);

}

const t=
total();

const ef=
Number(
posEfectivo.value
)||0;

if(
posMetodo.value===
'EFECTIVO'&&
ef<t.total
){

return msg(
'mensajePos',
'Efectivo insuficiente.',
'error'
);

}

if(
!confirm(
'¿Cobrar '+
Q(t.total)+
'?'
)
){

return;

}

api(
'venta',
{

clave:
API_CLAVE,

items:
JSON.stringify(
carrito.map(
x=>({
codigo:x.codigo,
cantidad:x.cantidad
})
)
),

cliente:
posCliente.value,

nit:
posNit.value,

metodo:
posMetodo.value,

efectivo:
ef,

descuento:
t.desc,

usuario:
posUsuario.value,

nota:
posNota.value

},
r=>{

if(!r.ok){

return msg(
'mensajePos',
r.error,
'error'
);

}

ticketHTML(
r
);

carrito=[];

renderCarrito();

posCliente.value='';
posNit.value='';
posNota.value='';
posDescuento.value=0;
posEfectivo.value=0;

ticketCard
.classList
.remove(
'oculto'
);

cargarResumen();

msg(
'mensajePos',
'Venta registrada: '+
r.numeroVenta,
'ok'
);

}
);

}

function ticketHTML(v){

let f='';

(v.items||[])
.forEach(
x=>
f+=

'<tr>'+

'<td>'+
esc(x.modelo)+
'<br><small>'+
esc(x.color)+
' T.'+
esc(x.talla)+
'</small></td>'+

'<td class="derecha">'+
x.cantidad+
'</td>'+

'<td class="derecha">'+
Q(x.subtotal)+
'</td>'+

'</tr>'
);

ticket.innerHTML=

'<h2>COMERCIAL ADELAIDA</h2>'+

'<div class="centro">Comprobante de venta</div>'+

'<hr>'+

'<div>Venta: '+
esc(v.numeroVenta)+
'</div>'+

'<div>Fecha: '+
esc(v.fecha)+
'</div>'+

(
v.cliente
?
'<div>Cliente: '+
esc(v.cliente)+
'</div>'
:
''
)+

'<hr>'+

'<table>'+
f+
'</table>'+

'<hr>'+

'<div class="lineaTotal"><span>Subtotal</span><b>'+
Q(v.subtotal)+
'</b></div>'+

'<div class="lineaTotal"><span>Descuento</span><b>'+
Q(v.descuento)+
'</b></div>'+

'<div class="lineaTotal"><span>TOTAL</span><b>'+
Q(v.total)+
'</b></div>'+

'<div>Pago: '+
esc(v.metodoPago)+
'</div>'+

(
v.metodoPago===
'EFECTIVO'
?
'<div>Recibido: '+
Q(v.efectivoRecibido)+
'</div>'+
'<div>Cambio: '+
Q(v.cambio)+
'</div>'
:
''
)+

'<hr>'+

'<div class="centro">¡Gracias por su compra!</div>';

}

async function toggleCam(){

if(scannerPos){

try{

if(
scannerPos.isScanning
){

await scannerPos.stop();

}

await scannerPos.clear();

}catch(e){}

scannerPos=null;

scanPosBox
.classList
.add(
'oculto'
);

btnCamPos.textContent=
'📷 Abrir cámara continua';

return;

}

scanPosBox
.classList
.remove(
'oculto'
);

btnCamPos.textContent=
'⏹ Cerrar cámara';

scannerPos=
new Html5Qrcode(
'readerPos'
);

try{

await scannerPos.start(

{
facingMode:
'environment'
},

{
fps:10,
qrbox:{
width:280,
height:170
}
},

txt=>{

const n=
Date.now();

if(
txt===ultimo&&
n-ultimoTs<
1500
){

return;

}

ultimo=txt;
ultimoTs=n;

agregar(
txt
);

},

()=>{}

);

}catch(e){

scannerPos=null;

scanPosBox
.classList
.add(
'oculto'
);

btnCamPos.textContent=
'📷 Abrir cámara continua';

msg(
'mensajePos',
'No se pudo abrir la cámara.',
'error'
);

}

}

function api(
a,
p,
cb
){

if(!API_URL){

vista(
'config'
);

return;

}

const n=
'__cb_'+
Date.now()+
'_'+
Math.floor(
Math.random()*
99999
);

const s=
document.createElement(
'script'
);

const d=
Object.assign(
{},
p||{},
{
accion:a,
callback:n
}
);

const q=
Object
.keys(d)
.map(
k=>
encodeURIComponent(k)+
'='+
encodeURIComponent(
d[k]??''
)
)
.join(
'&'
);

const tm=
setTimeout(
()=>{

lim();

cb({
ok:false,
error:'Tiempo agotado.'
});

},
15000
);

window[n]=
r=>{

clearTimeout(
tm
);

lim();

cb(r);

};

s.onerror=
()=>{

clearTimeout(
tm
);

lim();

cb({
ok:false,
error:'No se pudo conectar.'
});

};

function lim(){

try{

delete window[n];

}catch(e){}

try{

s.remove();

}catch(e){}

}

s.src=
API_URL+
(
API_URL.includes(
'?'
)
?
'&'
:
'?'
)+
q;

document.body
.appendChild(
s
);

}

function msg(
id,
tipoTexto,
tipo
){

document
.getElementById(
id
)
.innerHTML=

'<div class="mensaje '+
tipo+
'">'+
esc(
tipoTexto
)+
'</div>';

}

function Q(v) {
  const n = Number(v);

  return 'Q' + (
    Number.isFinite(n)
      ? n
      : 0
  ).toFixed(2);
}

function L(v){

return String(
v||''
)
.trim()
.toUpperCase()
.normalize(
'NFD'
)
.replace(
/[\u0300-\u036f]/g,
''
)
.replace(
/[^A-Z0-9]/g,
''
);

}

function esc(v){

return String(
v??''
)
.replaceAll(
'&',
'&amp;'
)
.replaceAll(
'<',
'&lt;'
)
.replaceAll(
'>',
'&gt;'
)
.replaceAll(
'"',
'&quot;'
)
.replaceAll(
"'",
'&#039;'
);

}
